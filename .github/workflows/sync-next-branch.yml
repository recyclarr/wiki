# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Sync Next Branch

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rebase-next:
    name: Rebase next onto master
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RECYCLARR_APP_ID }}
          private-key: ${{ secrets.RECYCLARR_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        # zizmor: ignore[artipacked] — needs credentials to push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Rebase next onto master
        run: |
          git config user.name "recyclarr[bot]"
          git config user.email "recyclarr[bot]@users.noreply.github.com"
          git checkout next
          git rebase master
          git push --force-with-lease origin next
