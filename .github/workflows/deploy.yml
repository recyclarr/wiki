# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Site

run-name: "Deploy Site (${{ github.event.workflow_run.head_branch }})"

on: # zizmor: ignore[dangerous-triggers] — only downloads artifacts, never checks out code
  workflow_run:
    workflows: [Build Site]
    types: [completed]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && !startsWith(github.event.workflow_run.head_branch, 'renovate/')
    steps:
      - name: Download build artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy to Cloudflare Pages
        if: steps.download.outcome == 'success'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy build --project-name=recyclarr-wiki --branch="$BRANCH"
