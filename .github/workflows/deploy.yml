# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Site

run-name: "Deploy Site (${{ github.event.workflow_run.head_branch }})"

on: # zizmor: ignore[dangerous-triggers] — only downloads artifacts, never checks out code
  workflow_run:
    workflows: [Build Site]
    types: [completed]

concurrency:
  group: >-
    deploy-${{ github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'push'
        || github.event.workflow_run.head_repository.full_name != github.repository)
      && !startsWith(github.event.workflow_run.head_branch, 'renovate/')
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # Fork branches get a prefix so a fork branch named after a deployed branch (e.g. master)
      # can only publish a sandboxed preview, never overwrite that branch's deployment.
      - name: Resolve Cloudflare branch
        id: branch
        env:
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          branch="$HEAD_BRANCH"
          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            branch="fork-$HEAD_OWNER-$HEAD_BRANCH"
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy build --project-name=recyclarr-wiki --branch="$BRANCH"
